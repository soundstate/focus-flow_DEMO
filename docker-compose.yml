version: "3.9"

services:
  # === Infrastructure ===

  postgres:
    image: postgres:15
    container_name: focus_flow_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: focus_flow_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: focus_flow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Application Services ===

  focus_engine:
    build:
      context: ./services/focus_engine
      dockerfile: Dockerfile
    container_name: focus_flow_focus_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      FOCUS_FLOW_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/focus_flow_db
      FOCUS_FLOW_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  game_engine:
    build:
      context: ./services/game_engine
      dockerfile: Dockerfile
    container_name: focus_flow_game_engine
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      GAME_ENGINE_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/focus_flow_db
      GAME_ENGINE_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai_insights:
    build:
      context: ./services/ai_insights
      dockerfile: Dockerfile
    container_name: focus_flow_ai_insights
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      AI_INSIGHTS_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/focus_flow_db
      AI_INSIGHTS_REDIS_URL: redis://redis:6379/0
      AI_INSIGHTS_OPENAI_API_KEY: ${AI_INSIGHTS_OPENAI_API_KEY:-sk-placeholder}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: focus_flow_analytics
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      ANALYTICS_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/focus_flow_db
      ANALYTICS_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  music_control:
    build:
      context: ./services/music_control
      dockerfile: Dockerfile
    container_name: focus_flow_music_control
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      MUSIC_CONTROL_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/focus_flow_db
      MUSIC_CONTROL_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
